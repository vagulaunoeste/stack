</style></head><body><canvas id="ambient" aria-hidden="true"></canvas><div id="app"></div><div id="msg" role="status"></div><button id="soundToggle" type="button" onclick="toggleSound()" aria-label="Desativar sons do jogo" aria-pressed="true">♫ Som ligado</button>
<script>
(()=>{
const canvas=document.getElementById('ambient'),ctx=canvas.getContext('2d',{alpha:true}),reduce=matchMedia('(prefers-reduced-motion: reduce)');
const iso=Math.cos(Math.PI/6),sin=Math.sin(Math.PI/6),models={cube:{w:54,d:44,h:42,shape:'box'},rect:{w:94,d:32,h:29,shape:'box'},l:{w:76,d:68,h:34,shape:'l'}};
let W=0,H=0,dpr=1,lanes=[],falling=[],settled=[],last=0,lastSpawn=0,frame=0,raf=0,colors={},mobile=false;
const rnd=(a,b)=>a+Math.random()*(b-a),readColors=()=>{const s=getComputedStyle(document.documentElement);colors={top:s.getPropertyValue('--am-top').trim(),left:s.getPropertyValue('--am-left').trim(),right:s.getPropertyValue('--am-right').trim(),edge:s.getPropertyValue('--am-edge').trim(),shadow:s.getPropertyValue('--am-shadow').trim()}};
function footprint(m){const w=m.w,d=m.d;if(m.shape==='l'){const t=Math.min(w,d)*.42;return[[-w/2,-d/2],[w/2,-d/2],[w/2,-d/2+t],[-w/2+t,-d/2+t],[-w/2+t,d/2],[-w/2,d/2]]}return[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]]}
function project(x,y,z,a){const c=Math.cos(a),s=Math.sin(a),rx=x*c-y*s,ry=x*s+y*c;return[(rx-ry)*iso,(rx+ry)*sin-z]}
function drop(m,a){return Math.max(...footprint(m).map(v=>project(v[0],v[1],0,a)[1]))}
function make(type,x,y,lane){const m=models[type],angle=rnd(-.18,.18);return{type,m,x,y,lane,angle,spin:rnd(-.24,.24),vy:0,targetX:x,opacity:rnd(.48,.72),bounced:false}}
function laneCount(){return mobile?2:4}
function setup(){W=innerWidth;H=innerHeight;mobile=W<560;dpr=Math.min(devicePixelRatio||1,mobile?1:1.5);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);lanes=[];falling=[];settled=[];const n=laneCount(),step=W/n;for(let i=0;i<n;i++)lanes.push({x:(i+.5)*step,jitter:step*.12,step,height:0,pieces:[],coolUntil:0,fadeStart:0});readColors();last=0;lastSpawn=performance.now()+850;if(reduce.matches)staticScene();paint();}
function staticScene(){for(let i=0;i<lanes.length;i++){const lane=lanes[i],count=i%2?1:2;for(let j=0;j<count;j++){const types=['cube','rect','l'],p=make(types[(i+j)%3],lane.x+rnd(-lane.jitter,lane.jitter),0,i);p.angle=Math.round(p.angle/(Math.PI/2))*Math.PI/2;p.y=H-10-lane.height-drop(p.m,p.angle);lane.height+=p.m.h;lane.pieces.push(p);settled.push(p)}}}
function spawn(now){const available=lanes.filter(l=>!l.coolUntil&&l.pieces.length<5);if(!available.length||falling.length>=(mobile?1:2)){lastSpawn=now+rnd(700,1300);return}const lane=available[Math.floor(Math.random()*available.length)],keys=Object.keys(models),p=make(keys[Math.floor(Math.random()*keys.length)],lane.x+rnd(-lane.jitter,lane.jitter),-100-rnd(0,100),lanes.indexOf(lane));p.targetX=p.x;p.vy=rnd(8,28);falling.push(p);lastSpawn=now+rnd(1300,3300)}
function polygon(points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=colors.edge;ctx.lineWidth=1;ctx.stroke()}
function drawPiece(p){const pts=footprint(p.m),angle=p.angle,bottom=pts.map(v=>project(v[0],v[1],0,angle)),top=pts.map(v=>project(v[0],v[1],p.m.h,angle));ctx.save();ctx.globalAlpha=p.opacity;ctx.fillStyle=colors.shadow;ctx.beginPath();ctx.ellipse(p.x,p.y+drop(p.m,angle)*.78,(p.m.w+p.m.d)*.22,Math.max(4,(p.m.w+p.m.d)*.065),0,0,Math.PI*2);ctx.fill();
for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],dx=b[0]-a[0],dy=b[1]-a[1],nx=dy,ny=-dx;if(nx+ny<=0)continue;const face=[bottom[i],bottom[(i+1)%pts.length],top[(i+1)%pts.length],top[i]].map(v=>[v[0]+p.x,v[1]+p.y]);polygon(face,nx>ny?colors.right:colors.left)}
polygon(top.map(v=>[v[0]+p.x,v[1]+p.y]),colors.top);ctx.restore()}
function paint(){ctx.clearRect(0,0,W,H);settled.sort((a,b)=>b.y-a.y);for(const p of settled)drawPiece(p);for(const p of falling)drawPiece(p)}
function step(now){if(reduce.matches||document.hidden){raf=0;return}if(now-last<32){raf=requestAnimationFrame(step);return}const dt=Math.min(.05,(now-last||32)/1000);last=now;const gravity=54;
for(let i=lanes.length-1;i>=0;i--){const lane=lanes[i];if(lane.height>H*.28&&!lane.fadeStart){lane.fadeStart=now;lane.coolUntil=now+2200;for(const p of lane.pieces)p.fadeAt=now}if(lane.coolUntil&&now>=lane.coolUntil){settled=settled.filter(p=>p.lane!==i);lane.pieces=[];lane.height=0;lane.coolUntil=0;lane.fadeStart=0}}
for(const p of falling){const lane=lanes[p.lane];p.angle+=p.spin*dt;p.x+=(p.targetX-p.x)*Math.min(1,dt*.7);p.vy=Math.min(102,p.vy+gravity*dt);p.y+=p.vy*dt;const ground=H-12-lane.height,hitY=ground-drop(p.m,p.angle);if(p.y>=hitY){if(!p.bounced&&p.vy>48){p.y=hitY;p.vy=-p.vy*.12;p.bounced=true;p.spin*=.55}else{p.angle=Math.round(p.angle/(Math.PI/2))*Math.PI/2+rnd(-.035,.035);p.y=ground-drop(p.m,p.angle);p.vy=0;p.spin=0;lane.height+=p.m.h;lane.pieces.push(p);settled.push(p);p.landed=true}}}
falling=falling.filter(p=>!p.landed);for(const p of settled)if(p.fadeAt)p.opacity=Math.max(0,(p.fadeAt+2200-now)/2200)*p.opacity;if(now>=lastSpawn)spawn(now);paint();raf=requestAnimationFrame(step)}
function start(){if(reduce.matches){paint();return}if(!raf){last=0;raf=requestAnimationFrame(step)}}
function motionChange(){if(raf){cancelAnimationFrame(raf);raf=0}setup();if(!reduce.matches)start()}
const observer=new MutationObserver(()=>{readColors();paint()});observer.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});if(reduce.addEventListener)reduce.addEventListener('change',motionChange);else reduce.addListener(motionChange);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}else start()});addEventListener('resize',()=>{clearTimeout(frame);frame=setTimeout(setup,140)});setup();start();
})();
</script>
